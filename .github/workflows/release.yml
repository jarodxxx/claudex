name: Release

# Triggered by pushing a tag like v0.1.0. The workflow builds Claudex with the
# Developer ID Application certificate, notarizes the .app with Apple, packages
# it into a signed .dmg, attaches it to a GitHub Release, then dispatches a
# workflow in the homebrew-tap repo to bump the cask formula.
#
# Required GitHub Secrets (configure in repo Settings → Secrets and variables → Actions):
#   MACOS_CERTIFICATE          base64-encoded .p12 of "Developer ID Application: Elanos (5FDYH5TMJ3)"
#   MACOS_CERTIFICATE_PASSWORD password used when exporting the .p12 from Keychain Access
#   KEYCHAIN_PASSWORD          arbitrary password for the temporary CI keychain
#   APPLE_ID                   Apple ID email tied to the Apple Developer account
#   APPLE_ID_PASSWORD          app-specific password generated at appleid.apple.com
#   MACOS_TEAM_ID              "5FDYH5TMJ3"
#   HOMEBREW_TAP_TOKEN         Personal Access Token with `repo` scope on jarodxxx/homebrew-tap

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pin to 16.2 (the latest stable available on macos-14 runners as
          # of May 2026). Update if newer Xcode 16.x lands.
          xcode-version: 'latest-stable'

      - name: Install build tools
        run: |
          brew install xcodegen create-dmg

      - name: Set version
        id: version
        run: |
          # Strip the leading "v" from the tag (v0.1.0 → 0.1.0)
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID Application certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$CERTIFICATE" | base64 --decode > /tmp/cert.p12

          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          security import /tmp/cert.p12 -k build.keychain \
            -P "$CERTIFICATE_PWD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" build.keychain

          rm /tmp/cert.p12
          security find-identity -v -p codesigning build.keychain

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Claudex.xcodeproj \
            -scheme Claudex \
            -configuration Release \
            -archivePath build/Claudex.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ secrets.MACOS_TEAM_ID }} \
            CODE_SIGN_IDENTITY="Developer ID Application"

      - name: Export signed .app
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath build/Claudex.xcarchive \
            -exportOptionsPlist scripts/ExportOptions.plist \
            -exportPath build/Export

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          cd build/Export
          ditto -c -k --keepParent Claudex.app Claudex.zip

          xcrun notarytool submit Claudex.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

          xcrun stapler staple Claudex.app
          rm Claudex.zip

      - name: Build DMG
        run: |
          set -euo pipefail
          mkdir -p build/dmg
          cp -R build/Export/Claudex.app build/dmg/

          # create-dmg returns non-zero on cosmetic warnings even when the
          # .dmg is produced. We tolerate that and verify the file exists.
          create-dmg \
            --volname "Claudex" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Claudex.app" 175 200 \
            --hide-extension "Claudex.app" \
            --app-drop-link 425 200 \
            "build/Claudex-${{ steps.version.outputs.version }}.dmg" \
            "build/dmg/" || true

          test -f "build/Claudex-${{ steps.version.outputs.version }}.dmg"

      - name: Compute SHA256
        id: sha
        run: |
          DMG="build/Claudex-${{ steps.version.outputs.version }}.dmg"
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "DMG SHA256: $SHA"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Extract the [Unreleased] / [latest] section of CHANGELOG if any,
          # otherwise fall back to a simple message.
          NOTES_FILE=$(mktemp)
          {
            echo "## Claudex ${{ steps.version.outputs.version }}"
            echo ""
            echo "Signed and notarized .dmg built by GitHub Actions."
            echo ""
            echo "**Install via Homebrew Cask:**"
            echo '```bash'
            echo "brew install --cask jarodxxx/tap/claudex"
            echo '```'
            echo ""
            echo "**Or download the .dmg below**, drag Claudex.app to /Applications, double-click to launch."
            echo ""
            echo "DMG SHA256: \`${{ steps.sha.outputs.sha256 }}\`"
          } > "$NOTES_FILE"

          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Claudex ${{ steps.version.outputs.tag }}" \
            --notes-file "$NOTES_FILE" \
            "build/Claudex-${{ steps.version.outputs.version }}.dmg"

      - name: Bump Homebrew Cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run update-cask.yml \
            --repo jarodxxx/homebrew-tap \
            --ref main \
            -f version="${{ steps.version.outputs.version }}" \
            -f sha256="${{ steps.sha.outputs.sha256 }}" \
            -f tag="${{ steps.version.outputs.tag }}"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
